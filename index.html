<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beautiful Flowchart Maker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="toolbar glass-effect">
            <h1 class="logo"><i class="fa-solid fa-diagram-project"></i> FlowCreate</h1>
            
            <div class="tool-section">
                <h3><i class="fa-solid fa-plus"></i> 追加</h3>
                <button class="tool-btn" onclick="setMode('addNode', 'rectangle')">
                    <div class="shape-icon rect"></div> 四角形
                </button>
                <button class="tool-btn" onclick="setMode('addNode', 'pill')">
                    <div class="shape-icon pill"></div> 角丸四角形
                </button>
                <button class="tool-btn" onclick="setMode('addNode', 'circle')">
                    <div class="shape-icon circle"></div> 円 / 楕円
                </button>
                <button class="tool-btn" onclick="setMode('addNode', 'diamond')">
                    <div class="shape-icon diamond"></div> ひし形
                </button>
            </div>

            <div class="tool-section">
                <h3><i class="fa-solid fa-arrow-pointer"></i> 選択・編集</h3>
                <button class="tool-btn active" id="btn-select" onclick="setMode('select')">
                    <i class="fa-solid fa-arrow-pointer"></i> 選択 / 移動
                </button>
            </div>

            <div class="tool-section" id="properties-panel" style="display: none;">
                <h3><i class="fa-solid fa-sliders"></i> プロパティ</h3>
                <label style="font-size: 0.8rem; color: #cbd5e1;">色:</label>
                <div class="color-picker">
                    <div class="color-swatch" style="background: #3b82f6" onclick="changeNodeColor('#3b82f6')"></div>
                    <div class="color-swatch" style="background: #10b981" onclick="changeNodeColor('#10b981')"></div>
                    <div class="color-swatch" style="background: #f59e0b" onclick="changeNodeColor('#f59e0b')"></div>
                    <div class="color-swatch" style="background: #ef4444" onclick="changeNodeColor('#ef4444')"></div>
                    <div class="color-swatch" style="background: #8b5cf6" onclick="changeNodeColor('#8b5cf6')"></div>
                    <div class="color-swatch" style="background: #1f2937" onclick="changeNodeColor('#1f2937')"></div>
                </div>
                <label style="font-size: 0.8rem; color: #cbd5e1;">形:</label>
                <select id="shape-select" onchange="changeNodeShape(this.value)" class="glass-select">
                    <option value="rectangle">四角形</option>
                    <option value="pill">角丸四角形</option>
                    <option value="circle">円形</option>
                    <option value="diamond">ひし形</option>
                </select>
                <button class="tool-btn danger" onclick="deleteSelected()">
                    <i class="fa-solid fa-trash"></i> 削除
                </button>
            </div>
            
            <div class="tool-section" style="margin-top: auto;">
                <h3><i class="fa-solid fa-download"></i> エクスポート</h3>
                <button class="tool-btn" onclick="exportFlowchart('png')">
                    <i class="fa-solid fa-image"></i> PNGで保存
                </button>
                <button class="tool-btn" onclick="exportFlowchart('jpg')">
                    <i class="fa-solid fa-file-image"></i> JPGで保存
                </button>
                <button class="tool-btn" onclick="exportFlowchart('pdf')">
                    <i class="fa-solid fa-file-pdf"></i> PDFで保存
                </button>
            </div>
            
            <button class="tool-btn danger" onclick="clearCanvas()">
                <i class="fa-solid fa-eraser"></i> すべてクリア
            </button>
        </aside>

        <!-- Canvas Area -->
        <main class="canvas-area" id="canvas-area">
            <div class="canvas-content" id="canvas-content">
                <svg id="svg-canvas" width="100%" height="100%">
                    <defs>
                        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                            <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8" />
                        </marker>
                        <marker id="arrowhead-hover" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                            <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444" />
                        </marker>
                    </defs>
                </svg>
                <div id="nodes-container"></div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
